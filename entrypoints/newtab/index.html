<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTab</title>
    <link rel="icon" href="/icon/32.png" />
    <script src="/theme-init.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
      }
      html.dark, html.dark body {
        background-color: #090a0f !important;
        color: #f8fafc !important;
      }
      html.theme-nord, html.theme-nord body {
        background-color: #242933 !important;
      }
      html.theme-catppuccin, html.theme-catppuccin body {
        background-color: #181825 !important;
      }
      html.theme-tokyo-night, html.theme-tokyo-night body {
        background-color: #13141f !important;
      }
      html.theme-cream, html.theme-cream body {
        background-color: #fbf7ee !important;
      }
      html.theme-sepia, html.theme-sepia body {
        background-color: #2b221d !important;
      }
    </style>
  </head>
  <body class="min-h-screen antialiased">
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
